[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ludot-lsp"
version = "0.1.0"
description = "Standalone language server for the Ludot Luau dialect"
requires-python = ">=3.12"

[project.scripts]
ludot-lsp = "ludot_lsp.__main__:main"

[tool.setuptools.packages.find]
where = ["tools"]
include = ["ludot_lsp*"]
