name: Desktop builds
# Pull requests build their head once. Pushes build only on main, so a branch with
# an open pull request is not compiled twice for the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Finish the running build so it can save its object cache. GitHub keeps only
# the newest pending run for this branch while it waits for that cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  CACHE_DIRECTORY: ${{ github.workspace }}/.ci-cache/scons/
  CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
  CCACHE_MAXSIZE: 500M
  SCCACHE_GHA_ENABLED: 'true'
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Blacksmith runners. Linux keeps its compiler caches on a sticky disk, so
          # nothing is downloaded or uploaded. The other platforms use Blacksmith's
          # colocated Actions cache.
          - os: blacksmith-32vcpu-ubuntu-2404
            platform: linuxbsd
            sconsflags: linker=mold scu_build=yes
          - os: blacksmith-16vcpu-windows-2025
            platform: windows
            sconsflags: ''
          # Godot 4.7 requires Apple Clang 16 or newer.
          - os: blacksmith-12vcpu-macos-26
            platform: macos
            sconsflags: generate_bundle=yes
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      - name: Windows compiler cache
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.18.0
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ccache mold libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev
      - name: macOS compiler cache
        if: runner.os == 'macOS'
        run: command -v ccache || brew install ccache
      - name: macOS Vulkan SDK
        if: runner.os == 'macOS'
        run: bash engine/misc/scripts/install_vulkan_sdk_macos.sh
      - run: python -m pip install scons==4.11.1
      # Shared by every branch and pull request. Only the default branch commits
      # changes when branch protection is on; other runs still read the warm cache.
      - name: Mount compiler caches
        if: runner.os == 'Linux'
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-linuxbsd-compiler-caches
          path: ${{ github.workspace }}/.ci-cache
      - name: Restore language compiler cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: language-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            language-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure language tools
        shell: bash
        run: |
          flags=()
          if [ "$RUNNER_OS" != "Windows" ]; then
            flags+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          else
            flags+=(-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF "${flags[@]}"
      - name: Build language tools
        run: cmake --build build --target Luau.Repl.CLI Luau.Analyze.CLI Luau.Compile.CLI ludot-shader --parallel
      - name: Compiler cache statistics
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            sccache --show-stats
          else
            ccache --show-stats
          fi
      - name: Save language compiler cache
        if: always() && runner.os == 'macOS'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: language-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Language, shader, and LSP tests
        run: ctest --test-dir build --output-on-failure
      - name: Package standalone LSP
        run: |
          python -m pip install pyinstaller==6.22.3
          python tools/package_lsp.py
      # SCons caches objects by content, so only files that changed since the cached
      # build are recompiled.
      # Keys omit the branch: cache scoping already limits which runs can read an
      # entry, and a pull request's merge ref never matched a branch-named key.
      - name: Restore SCons cache
        if: runner.os != 'Linux'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CACHE_DIRECTORY }}
          key: scons-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            scons-${{ matrix.platform }}-
      - name: Store cache timestamp
        shell: bash
        run: echo "CACHE_TIMESTAMP=$(date +%s)" >> "$GITHUB_ENV"
      # Prebuilt SDKs that the Windows and macOS builds link against, as in upstream Godot CI.
      # Each one is optional, so a failed download builds without that feature.
      - name: Engine SDK dependencies
        id: deps
        if: runner.os != 'Linux'
        working-directory: engine
        shell: bash
        run: |
          flags=""
          install() {
            if python "./misc/scripts/$2"; then flags="$flags $1=yes"; else echo "::warning::$2 failed, building with $1=no"; flags="$flags $1=no"; fi
          }
          if [ "$RUNNER_OS" = "Windows" ]; then
            install d3d12 install_d3d12_sdk_windows.py
            python ./misc/scripts/install_winrt.py || echo "::warning::WinRT components failed to install"
          fi
          install angle install_angle.py
          install accesskit install_accesskit.py
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
      - name: Build editor
        id: build
        working-directory: engine
        shell: bash
        run: scons platform=${{ matrix.platform }} target=editor debug_symbols=no module_mono_enabled=no cache_path="$CACHE_DIRECTORY" ${{ matrix.sconsflags }} ${{ steps.deps.outputs.flags }} -j$(python -c "import os; print(os.cpu_count())" | tr -d '\r')
      - name: Drop cache entries the build did not use
        if: always() && steps.build.outcome != 'skipped'
        working-directory: engine
        run: python misc/scripts/purge_cache.py ${{ env.CACHE_TIMESTAMP }} "${{ env.CACHE_DIRECTORY }}"
      - name: Save SCons cache
        if: always() && steps.build.outcome != 'skipped' && runner.os != 'Linux'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CACHE_DIRECTORY }}
          key: scons-${{ matrix.platform }}-${{ github.sha }}
      - name: Bundle StyLua
        shell: python
        run: |
          import io, pathlib, shutil, sys, urllib.request, zipfile
          directory = pathlib.Path("engine/bin")
          if sys.platform == "darwin":
              directory /= "ludot_macos_editor.app/Contents/MacOS"
          suffix = ".exe" if sys.platform == "win32" else ""
          platform = {"linux": "linux", "darwin": "macos", "win32": "windows"}[sys.platform]
          stylua_target = {"linux": "linux-x86_64", "darwin": "macos-aarch64", "win32": "windows-x86_64"}[sys.platform]
          downloads = {
              "stylua": f"https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-{stylua_target}.zip",
              "selene": f"https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-{platform}.zip",
          }
          for tool, url in downloads.items():
              archive = zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(url).read()))
              binary = next(name for name in archive.namelist() if pathlib.PurePosixPath(name).name == tool + suffix)
              destination = directory / (f"ludot.{tool}" + suffix)
              destination.write_bytes(archive.read(binary))
              destination.chmod(0o755)
          shutil.copy2("thirdparty/stylua/LICENSE.md", directory / "ludot.stylua.LICENSE.md")
          shutil.copy2("thirdparty/selene/LICENSE.md", directory / "ludot.selene.LICENSE.md")
      - name: Native engine, debugger, and export tests
        if: runner.os != 'macOS'
        run: python tools/test_desktop.py
      - name: macOS app bundle tests
        if: runner.os == 'macOS'
        run: python tools/test_desktop.py engine/bin/ludot_macos_editor.app
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent engine/bin/ludot_macos_editor.app dist/ludot-macos-editor.zip
      - name: Upload standalone LSP
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ludot-lsp-${{ matrix.platform }}
          retention-days: 7
          path: |
            dist/ludot-lsp-*.tar.gz
            dist/ludot-lsp-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ludot-${{ matrix.platform }}
          retention-days: 7
          path: |
            engine/bin/ludot.*
            dist/ludot-macos-editor.zip
            engine/misc/dist/linux/org.ludotengine.Ludot.*
            build/ludot-shader*
            build/luau/luau*
            tools/ludot_lsp/*.py
            tools/ludot-lsp
